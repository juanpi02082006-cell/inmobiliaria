# =============================================================================
#  Configuracion centralizada de la conexion JDBC.
#
#  El PDF exige que la cadena de conexion este centralizada y sea configurable,
#  y que NO se repita en cada clase. Por eso ninguna clase Java escribe la URL:
#  todas piden la conexion a com.inmobiliaria.config.ConexionBD, que lee este
#  archivo desde el classpath (WEB-INF/classes/db.properties).
#
#  Para pasar de la instancia local a la instancia en linea basta con cambiar
#  la propiedad db.perfil de "local" a "online" y reiniciar Tomcat.
#  No hay que recompilar ni tocar una sola clase.
# =============================================================================

db.perfil=local

# --- Instancia LOCAL (XAMPP / MySQL 8) ---------------------------------------
db.local.driver=com.mysql.cj.jdbc.Driver
db.local.url=jdbc:mysql://localhost:3306/inmobiliaria?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&characterEncoding=UTF-8
db.local.usuario=root
db.local.password=

# --- Instancia EN LINEA ------------------------------------------------------
# Complete estos datos con los del proveedor (Clever Cloud, Railway, Aiven...)
# y cambie db.perfil=online para desplegar contra la nube.
db.online.driver=com.mysql.cj.jdbc.Driver
db.online.url=jdbc:mysql://HOST_REMOTO:3306/inmobiliaria?useSSL=true&serverTimezone=America/Bogota&characterEncoding=UTF-8
db.online.usuario=USUARIO_REMOTO
db.online.password=CLAVE_REMOTA
